<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haushalt">

<title>Haushalts-Punkte</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449;
    --koni:#38bdf8; --claude:#f472b6; --jakob:#fb923c;
    --text:#e2e8f0; --muted:#94a3b8; --gold:#fbbf24;
    --green:#34d399; --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Segoe UI",sans-serif;
    background:radial-gradient(1200px 800px at 70% -10%,#1e3a5f 0%,var(--bg) 55%);
    color:var(--text);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x:hidden;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:18px 18px 90px;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  h1{font-size:22px; margin:0; letter-spacing:.3px;}
  .week{font-size:13px; color:var(--muted);}
  .iconbtn{background:var(--panel); border:none; color:var(--text); border-radius:14px; padding:10px 14px; font-size:15px; cursor:pointer;}
  .iconbtn:active{transform:scale(.95);}
  .hbtns{display:flex; gap:8px; flex-wrap:wrap;}

  .syncdot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--muted); margin-right:6px; vertical-align:middle;}
  .syncdot.on{background:var(--green); box-shadow:0 0 8px var(--green);}
  .syncdot.off{background:var(--muted);}
  .syncdot.err{background:#f87171;}

  .board{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:16px;}
  .player{
    background:var(--panel); border-radius:var(--radius); padding:16px; position:relative; overflow:hidden;
    border:2px solid transparent; transition:border-color .2s, transform .1s;
  }
  .player.active{border-color:currentColor; box-shadow:0 0 0 4px rgba(255,255,255,.04), 0 8px 30px rgba(0,0,0,.35);}
  .player .glow{position:absolute; inset:0; opacity:.10; background:currentColor;}
  .player .top{display:flex; align-items:center; gap:10px; position:relative;}
  .pname{font-size:18px; font-weight:700;}
  .plevel{font-size:12px; color:var(--muted);}
  .pscore{font-size:48px; font-weight:800; line-height:1; margin-top:6px; position:relative; font-variant-numeric:tabular-nums; transition:transform .15s;}
  .pscore.bump{transform:scale(1.12);}
  .pscore small{font-size:15px; color:var(--muted); font-weight:600;}
  .koni{color:var(--koni);} .claude{color:var(--claude);} .jakob{color:var(--jakob);}
  .bar{height:8px; background:rgba(255,255,255,.08); border-radius:6px; margin-top:12px; overflow:hidden; position:relative;}
  .bar > i{display:block; height:100%; background:currentColor; border-radius:6px; transition:width .4s ease;}
  .bar.mini{height:5px; margin-top:5px; opacity:.8;}
  .streak{font-size:12px; color:var(--muted); margin-top:8px; position:relative;}
  .rankrow{font-size:12px; color:var(--muted); margin-top:8px; position:relative;}
  .crown{position:absolute; top:12px; right:14px; font-size:24px; animation:bobble 2s ease-in-out infinite;}
  @keyframes bobble{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
  .medals{font-size:18px; margin-top:8px; position:relative; line-height:1.5; letter-spacing:1px;}
  .medals .more{font-size:12px; color:var(--muted);}

  /* Rang-Avatar */
  .avatar{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:26px; background:rgba(255,255,255,.08);}
  .av{position:relative; flex-shrink:0;}
  .av .ring{position:absolute; inset:0; border-radius:50%; background:var(--ring,#475569); box-shadow:var(--glow,none);}
  .av .face{position:absolute; inset:3px; border-radius:50%; background:#1b2536; display:grid; place-items:center;}
  .av.spin .ring{animation:spin 6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .av.aura .ring{animation:spin 6s linear infinite, auraPulse 1.8s ease-in-out infinite;}
  @keyframes auraPulse{0%,100%{box-shadow:0 0 14px 2px rgba(255,255,255,.4)}50%{box-shadow:0 0 30px 8px rgba(255,255,255,.75)}}
  .av .crown{position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:18px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.5)); z-index:3; animation:none;}
  .av .deco{position:absolute; bottom:-4px; right:-4px; font-size:16px; background:#0f172a; border-radius:50%; padding:1px 2px; z-index:3;}
  .av .spark{position:absolute; top:-8px; right:-8px; font-size:15px; animation:sparkle 1.4s ease-in-out infinite; z-index:3;}
  @keyframes sparkle{0%,100%{opacity:.4; transform:scale(.8) rotate(0)}50%{opacity:1; transform:scale(1.2) rotate(20deg)}}

  .toggle{display:flex; flex-wrap:wrap; background:var(--panel); border-radius:18px; padding:6px; margin-bottom:18px; gap:6px;}
  .toggle button{flex:1; min-width:90px; border:none; background:transparent; color:var(--muted); font-size:16px; font-weight:700; padding:14px; border-radius:13px; cursor:pointer; transition:.2s;}
  .toggle button.on{background:var(--panel2); color:var(--text);}
  .toggle button.on.koni{color:var(--koni); box-shadow:inset 0 0 0 2px var(--koni);}
  .toggle button.on.claude{color:var(--claude); box-shadow:inset 0 0 0 2px var(--claude);}
  .toggle button.on.jakob{color:var(--jakob); box-shadow:inset 0 0 0 2px var(--jakob);}

  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:18px 4px 10px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .chore{
    background:var(--panel); border:none; color:var(--text); border-radius:var(--radius);
    padding:16px 12px; cursor:pointer; text-align:center; position:relative; min-height:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s, box-shadow .2s; overflow:hidden;
  }
  .chore:active{transform:scale(.94);}
  .chore.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.1); box-shadow:0 0 0 3px var(--green)}100%{transform:scale(1)}}
  .chore .emoji{font-size:34px; transition:transform .3s;}
  .chore.pop .emoji{animation:wiggle .4s ease;}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.15)}75%{transform:rotate(12deg) scale(1.15)}}
  .chore .cname{font-size:15px; font-weight:600; line-height:1.2;}
  .chore .pts{font-size:13px; color:var(--gold); font-weight:700;}
  .chore.golden{box-shadow:inset 0 0 0 2px var(--gold); background:linear-gradient(180deg,#3a2f12,#1e293b); animation:goldpulse 2s ease-in-out infinite;}
  @keyframes goldpulse{0%,100%{box-shadow:inset 0 0 0 2px var(--gold), 0 0 0 0 rgba(251,191,36,0)}50%{box-shadow:inset 0 0 0 2px var(--gold), 0 0 16px 2px rgba(251,191,36,.35)}}
  .chore .badge{position:absolute; top:6px; right:8px; font-size:11px; background:var(--gold); color:#3a2a06; font-weight:800; padding:2px 7px; border-radius:20px;}
  .ripple{position:absolute; border-radius:50%; background:rgba(255,255,255,.35); transform:scale(0); pointer-events:none; width:120px; height:120px; margin:-60px 0 0 -60px;}
  @keyframes rippleAnim{to{transform:scale(3); opacity:0}}

  .float{position:fixed; font-size:30px; font-weight:800; pointer-events:none; z-index:50; animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.6);}15%{opacity:1; transform:translateY(-10px) scale(1.2);}100%{opacity:0; transform:translateY(-90px) scale(1);}}

  .confetti{position:fixed; pointer-events:none; z-index:120; border-radius:2px;}

  .log{background:var(--panel); border-radius:var(--radius); padding:6px 4px; max-height:260px; overflow-y:auto;}
  .log .row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.05); font-size:14px;}
  .log .row:last-child{border-bottom:none;}
  .log .who{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .log .row .t{color:var(--muted); font-size:12px; margin-left:auto;}
  .log .undo{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 6px;}
  .empty{color:var(--muted); text-align:center; padding:24px; font-size:14px;}

  .snackbar{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%,140px);
    background:var(--panel2); color:var(--text); padding:12px 14px 12px 16px; border-radius:16px; display:flex; gap:14px;
    align-items:center; box-shadow:0 12px 34px rgba(0,0,0,.5); z-index:80; max-width:92%; font-size:14px; opacity:0; transition:transform .3s, opacity .3s;}
  .snackbar.show{transform:translate(-50%,0); opacity:1;}
  .snackbar b{font-weight:700;}
  .snackbar button{background:var(--green); color:#06281c; border:none; border-radius:11px; padding:9px 14px; font-weight:800; font-size:14px; cursor:pointer; white-space:nowrap;}

  .celebrate{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:110;}
  .celebrate .card{background:var(--panel); border:2px solid var(--gold); border-radius:22px; padding:22px 30px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.55);}
  .celebrate .ce{font-size:60px; line-height:1;}
  .celebrate .ct{font-size:22px; font-weight:800; margin-top:8px;}
  .celebrate .cs{font-size:14px; color:var(--muted); margin-top:4px;}
  @keyframes celebIn{0%{transform:scale(.5); opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1); opacity:1}}
  @keyframes celebOut{to{opacity:0; transform:scale(.9)}}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel); border-radius:24px; padding:24px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto;}
  .modal h2{margin:0 0 6px; font-size:22px;}
  .modal p{color:var(--muted); font-size:14px; margin:0 0 16px;}
  .modal .big{font-size:64px; text-align:center; margin:10px 0;}
  .modal .winner{text-align:center; font-size:26px; font-weight:800; margin-bottom:6px;}
  .modal .sub{text-align:center; color:var(--muted); margin-bottom:18px;}
  .btnrow{display:flex; gap:10px; margin-top:14px;}
  .btn{flex:1; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; background:var(--panel2); color:var(--text);}
  .btn.primary{background:var(--green); color:#06281c;}
  .btn.danger{background:#7f1d1d; color:#fecaca;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel2); padding:8px 12px; border-radius:12px; margin:4px 4px 0 0; font-size:14px;}

  .editrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .editrow input{background:var(--panel2); border:1px solid rgba(255,255,255,.1); color:var(--text); border-radius:10px; padding:10px; font-size:15px;}
  .editrow input.em{width:54px; text-align:center;} .editrow input.nm{flex:1;} .editrow input.pt{width:64px;}
  .editrow .del{background:#7f1d1d; color:#fecaca; border:none; border-radius:10px; padding:10px 12px; cursor:pointer;}
  .addbtn{width:100%; border:1px dashed rgba(255,255,255,.2); background:transparent; color:var(--muted); border-radius:12px; padding:12px; cursor:pointer; font-size:15px; margin-top:6px;}
  .field{width:100%; background:var(--panel2); border:1px solid rgba(255,255,255,.1); color:var(--text); border-radius:12px; padding:14px; font-size:17px; margin-bottom:10px;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tabs button{flex:1; min-width:80px; border:none; background:var(--panel2); color:var(--muted); padding:12px; border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;}
  .tabs button.sel.koni{color:var(--koni); box-shadow:inset 0 0 0 2px var(--koni);}
  .tabs button.sel.claude{color:var(--claude); box-shadow:inset 0 0 0 2px var(--claude);}
  .tabs button.sel.jakob{color:var(--jakob); box-shadow:inset 0 0 0 2px var(--jakob);}
  .tstat{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tstat .box{flex:1; min-width:70px; background:var(--panel2); border-radius:12px; padding:10px; text-align:center;}
  .tstat .box b{display:block; font-size:20px;}
  .tstat .box span{font-size:11px; color:var(--muted);}
  .trophy-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:10px;}
  .trophy{background:var(--panel2); border-radius:14px; padding:12px 6px; text-align:center;}
  .trophy .te{font-size:30px;}
  .trophy .tn{font-size:11px; font-weight:700; margin-top:4px;}
  .trophy .td{font-size:10px; color:var(--muted); margin-top:2px; line-height:1.2;}
  .trophy.locked{opacity:.32; filter:grayscale(1);}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <h1>🏆 Haushalts-Punkte</h1>
      <div class="week" id="weekLabel"></div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="syncBtn"><span class="syncdot off" id="syncDot"></span>Sync</button>
      <button class="iconbtn" id="trophyBtn">🏅 Trophäen</button>
      <button class="iconbtn" id="editBtn">✏️ Aufgaben</button>
      <button class="iconbtn" id="weekBtn">🎁 Woche</button>
    </div>
  </header>

  <div class="board" id="board"></div>

  <div class="section-title">Wer macht die Aufgabe? (nur auf diesem Gerät)</div>
  <div class="toggle" id="toggle"></div>

  <div id="challengeWrap"></div>

  <div class="section-title">Aufgaben antippen = Punkte</div>
  <div class="grid" id="grid"></div>

  <div class="section-title">Verlauf</div>
  <div class="log" id="log"></div>
</div>

<div class="snackbar" id="snackbar"></div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>Aufgaben bearbeiten</h2>
    <p>Emoji, Name und Punkte. Änderungen werden sofort gespeichert &amp; synchronisiert.</p>
    <div id="editList"></div>
    <button class="addbtn" id="addChore">+ Aufgabe hinzufügen</button>
    <div class="btnrow"><button class="btn primary" id="editDone">Fertig</button></div>
  </div>
</div>

<div class="overlay" id="weekOverlay"><div class="modal" id="weekModal"></div></div>
<div class="overlay" id="syncOverlay"><div class="modal" id="syncModal"></div></div>
<div class="overlay" id="trophyOverlay"><div class="modal" id="trophyModal"></div></div>

<script type="module">
/* ====================================================================
   FIREBASE-ZUGANGSDATEN
   ==================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFS_EjbvlHZHPpV-FqiWdCFcYwU4-AmeU",
  authDomain: "haushaltsapp-d44f8.firebaseapp.com",
  projectId: "haushaltsapp-d44f8",
  storageBucket: "haushaltsapp-d44f8.firebasestorage.app",
  messagingSenderId: "503869566874",
  appId: "1:503869566874:web:7d1b258bdd4461df619423",
  measurementId: "G-EZMB5BXWK2"
};

/* ---------- Aufgaben ---------- */
const ADULT_CHORES = [
  {e:"🍽️", n:"Küche aufräumen", p:15},
  {e:"🧹", n:"Saugen", p:20},
  {e:"🚽", n:"Klo putzen", p:25},
  {e:"🛁", n:"Bad putzen", p:25},
  {e:"🗑️", n:"Müll rausbringen", p:10},
  {e:"🧺", n:"Wäsche waschen", p:15},
  {e:"👕", n:"Wäsche zusammenlegen", p:15},
  {e:"🍳", n:"Kochen", p:20},
  {e:"🧽", n:"Geschirr spülen", p:15},
  {e:"🛒", n:"Einkaufen", p:20},
  {e:"🌱", n:"Pflanzen gießen", p:5},
  {e:"🛏️", n:"Bett machen", p:5},
  {e:"🐶", n:"Hund Gassi", p:15},
  {e:"🪟", n:"Fenster putzen", p:30},
];
/* Aufgaben für Kleinkind (Jakob, 3 Jahre) – ganz einfach, kleine Punkte, oft "mit Hilfe" */
const KID_CHORES = [
  {e:"🧸", n:"Spielzeug wegräumen", p:5},
  {e:"📚", n:"Bücher ins Regal räumen", p:5},
  {e:"🧺", n:"Schmutzwäsche in den Korb", p:5},
  {e:"👟", n:"Schuhe wegstellen", p:5},
  {e:"🦷", n:"Zähne putzen (mit Hilfe)", p:5},
  {e:"🥄", n:"Löffel/Servietten auf den Tisch legen", p:5},
  {e:"🪴", n:"Blumen gießen (mit Hilfe)", p:5},
  {e:"🐻", n:"Kuscheltiere aufs Bett legen", p:5},
  {e:"🐾", n:"Haustier füttern (mit Hilfe)", p:5},
  {e:"🧹", n:"Unter dem Bett sauber machen", p:10},
];
/* Namen der ALTEN (schulkind-)Aufgaben – werden per Migration ersetzt */
const OLD_KID_CHORE_NAMES = ["Spielzeug aufräumen","Eigenes Bett machen","Zähne putzen (ohne Meckern)",
  "Schultasche packen","Tisch decken","Schmutzwäsche in den Korb","Hausaufgaben gemacht",
  "Haustier füttern","Beim Tisch abräumen helfen","Schuhe & Jacke wegräumen"];
const DEFAULT_CHORES = ADULT_CHORES.concat(KID_CHORES);

const PLAYERS = {
  koni:   {name:"Koni",   emoji:"🧔", cls:"koni"},
  claude: {name:"Claude", emoji:"👩", cls:"claude"},
  jakob:  {name:"Jakob",  emoji:"👦", cls:"jakob"},
};
const PLAYER_IDS = Object.keys(PLAYERS);
function colorOf(p){ return "var(--"+p+")"; }

/* Lebenslange Ränge – basieren auf insgesamt gesammelten Punkten (allTimePoints).
   Die Abstände werden bewusst immer größer (immer schwerer aufzusteigen). */
const RANKS = [
  {min:0,     e:"🐣", name:"Frischling"},
  {min:50,    e:"🧹", name:"Helferlein"},
  {min:150,   e:"🧽", name:"Putzhilfe"},
  {min:350,   e:"✨", name:"Guter Saubermacher"},
  {min:700,   e:"🌟", name:"Ordnungstalent"},
  {min:1300,  e:"🦸", name:"Haushaltsheld"},
  {min:2300,  e:"🏅", name:"Putz-Profi"},
  {min:4000,  e:"🥇", name:"Saubermeister"},
  {min:6500,  e:"👑", name:"Haushalts-Boss"},
  {min:10000, e:"🐐", name:"Putz-Legende"},
  {min:15000, e:"🏆", name:"Großmeister der Sauberkeit"},
  {min:22000, e:"⚡", name:"Haushalts-Gott"},
];
/* Avatar-Stufen: werden mit jedem Rang hochwertiger (Ring, Glow, Krone, Funkeln) */
const AVATAR_TIERS = [
  {ring:"#475569", glow:"none"},
  {ring:"#b45309", glow:"none"},
  {ring:"linear-gradient(135deg,#d97706,#b45309)", glow:"none", deco:"🧢"},
  {ring:"#9ca3af", glow:"none"},
  {ring:"linear-gradient(135deg,#e5e7eb,#9ca3af)", glow:"0 0 10px rgba(229,231,235,.45)"},
  {ring:"linear-gradient(135deg,#fbbf24,#d97706)", glow:"0 0 12px rgba(251,191,36,.5)"},
  {ring:"linear-gradient(135deg,#fde047,#f59e0b)", glow:"0 0 14px rgba(251,191,36,.6)", deco:"🎩"},
  {ring:"linear-gradient(135deg,#fde047,#f59e0b)", glow:"0 0 18px rgba(251,191,36,.7)", deco:"🎖️"},
  {ring:"linear-gradient(135deg,#fbbf24,#f59e0b)", glow:"0 0 18px rgba(251,191,36,.75)", crown:true},
  {ring:"linear-gradient(135deg,#67e8f9,#22d3ee,#38bdf8)", glow:"0 0 22px rgba(34,211,238,.75)", crown:true},
  {ring:"conic-gradient(#f472b6,#fbbf24,#34d399,#38bdf8,#a78bfa,#f472b6)", glow:"0 0 24px rgba(167,139,250,.7)", crown:true, spark:true, spin:true},
  {ring:"conic-gradient(#f472b6,#fbbf24,#34d399,#38bdf8,#a78bfa,#f472b6)", glow:"none", crown:true, spark:true, spin:true, aura:true},
];
function avatarHTML(player, rankIdx, size){
  const t=AVATAR_TIERS[Math.min(Math.max(rankIdx,0),AVATAR_TIERS.length-1)];
  const sz=size||54, cls="av"+(t.spin?" spin":"")+(t.aura?" aura":"");
  return `<div class="${cls}" style="width:${sz}px;height:${sz}px;--ring:${t.ring};--glow:${t.glow||'none'};">
    <div class="ring"></div>
    <div class="face" style="font-size:${Math.round(sz*0.5)}px">${PLAYERS[player].emoji}</div>
    ${t.crown?'<div class="crown">👑</div>':''}
    ${t.deco?`<div class="deco">${t.deco}</div>`:''}
    ${t.spark?'<div class="spark">✨</div>':''}
  </div>`;

/* ---------- Shared state ---------- */
const LS = "haushalt_v1";
function isoWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  const w=Math.ceil((((dt-ys)/86400000)+1)/7);
  return dt.getUTCFullYear()+"-W"+String(w).padStart(2,"0");
}
function freshPlayerWeek(){ return {score:0, total:0, streak:0, bestStreak:0, goldenDone:0, choreCounts:{}}; }
function freshWeek(){ const w={log:[], lastBy:null}; PLAYER_IDS.forEach(p=> w[p]=freshPlayerWeek()); return w; }
function freshStats(){ return {allTimeTotal:0, allTimePoints:0, challengesDone:0, dayStreak:0, bestDayStreak:0,
                              lastDay:null, earlyBird:false, nightOwl:false, achieved:[]}; }
function ensureShape(s){
  s.chores = s.chores || DEFAULT_CHORES.slice();
  s.data = s.data || freshWeek();
  s.stats = s.stats || {};
  for(const p of PLAYER_IDS){
    if(!s.data[p]) s.data[p]=freshPlayerWeek();
    const d=s.data[p]; if(d.bestStreak==null)d.bestStreak=0; if(d.goldenDone==null)d.goldenDone=0; if(!d.choreCounts)d.choreCounts={};
    s.stats[p]=Object.assign(freshStats(), s.stats[p]||{}); if(!Array.isArray(s.stats[p].achieved)) s.stats[p].achieved=[];
  }
  s.history = s.history || [];
  s.migrations = s.migrations || {};
  if(typeof s.rev!=="number") s.rev=0;
  return s;
}
function runMigrations(){
  let changed=false;
  if(!state.migrations.kidChores){
    KID_CHORES.forEach(kc=>{ if(!state.chores.some(c=>c.n===kc.n)) state.chores.push(kc); });
    state.migrations.kidChores=true; changed=true;
  }
  // V2: alte Schulkind-Aufgaben raus, neue Kleinkind-Aufgaben rein (Jakob, 3)
  if(!state.migrations.kidChoresV2){
    state.chores=state.chores.filter(c=>!OLD_KID_CHORE_NAMES.includes(c.n));
    KID_CHORES.forEach(kc=>{ if(!state.chores.some(c=>c.n===kc.n)) state.chores.push(kc); });
    state.migrations.kidChoresV2=true; changed=true;
  }
  // Manuell hinzugefügte Aufgaben mit Platzhalter ✅ bekommen ein passendes Icon
  if(!state.migrations.autoIcons){
    state.chores.forEach(c=>{ if(!c.e || c.e==="✅") c.e=guessIcon(c.n)||"🧹"; });
    state.migrations.autoIcons=true; changed=true;
  }
  if(changed) save();
}
function load(){
  let s; try{ s=JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(!s){ s={chores:DEFAULT_CHORES.slice(), week:isoWeek(new Date()), data:freshWeek(),
            history:[], goldenDay:null, golden:null, challenge:null, challengeDate:null, stats:{}, migrations:{}, rev:0}; }
  return ensureShape(s);
}
let state = load();

function save(bump=true){
  if(bump) state.rev=(state.rev||0)+1;
  localStorage.setItem(LS, JSON.stringify(state));
  queueSync();
}

/* ---------- Firebase ---------- */
let docRef=null, applyingRemote=false, saveTimer=null, fbSetDoc=null;
function setDot(cls){ const d=document.getElementById("syncDot"); if(d) d.className="syncdot "+cls; }
async function initSync(){
  if(!FIREBASE_CONFIG.apiKey){ setDot("off"); return; }
  const code=getFamilyCode();
  if(!code){ setDot("off"); openSync(); return; }
  try{
    const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const {getFirestore, doc, onSnapshot, setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app=initializeApp(FIREBASE_CONFIG);
    const db=getFirestore(app); fbSetDoc=setDoc;
    docRef=doc(db, "families", code);
    onSnapshot(docRef, (snap)=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists()){ pushNow(); return; }
      const r=snap.data();
      if((r.rev||0) < (state.rev||0)){ pushNow(); return; }
      applyingRemote=true;
      state.chores=r.chores||state.chores;
      state.week=r.week||state.week;
      state.data=r.data||state.data;
      state.history=r.history||state.history;
      state.golden=(r.golden===undefined?state.golden:r.golden);
      state.goldenDay=r.goldenDay||state.goldenDay;
      state.challenge=(r.challenge===undefined?state.challenge:r.challenge);
      state.challengeDate=r.challengeDate||state.challengeDate;
      state.stats=r.stats||state.stats;
      state.migrations=r.migrations||state.migrations;
      state.rev=r.rev||state.rev;
      ensureShape(state);
      localStorage.setItem(LS, JSON.stringify(state));
      applyingRemote=false;
      checkWeek(); ensureDaily(); render();
    }, (err)=>{ console.error(err); setDot("err"); });
    setDot("on");
  }catch(e){ console.error(e); setDot("err"); }
}
function snapshotForCloud(){
  return {chores:state.chores, week:state.week, data:state.data, history:state.history,
          golden:state.golden??null, goldenDay:state.goldenDay??null,
          challenge:state.challenge??null, challengeDate:state.challengeDate??null,
          stats:state.stats, migrations:state.migrations||{}, rev:state.rev||0, updatedAt:Date.now()};
}
async function pushNow(){
  if(!docRef||!fbSetDoc||applyingRemote) return;
  try{ await fbSetDoc(docRef, snapshotForCloud()); setDot("on"); }
  catch(e){ console.error(e); setDot("err"); }
}
function queueSync(){ if(!docRef||applyingRemote) return; clearTimeout(saveTimer); saveTimer=setTimeout(pushNow,250); }

/* ---------- Weekly rollover ---------- */
function checkWeek(){
  const now=isoWeek(new Date());
  if(state.week!==now){
    const scores=currentScores();
    state.history.unshift({week:state.week, scores, winner:weekWinner(scores), reward:pickReward()});
    state.history=state.history.slice(0,30);
    state.week=now; state.data=freshWeek();
    PLAYER_IDS.forEach(p=>checkAchievements(p));
    save();
    showWeekResult(state.history[0], true);
  }
}

/* ---------- Daily ---------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function ensureDaily(){
  const t=todayStr(); let changed=false;
  if(state.goldenDay!==t){ state.goldenDay=t; state.golden=state.chores.length?Math.floor(Math.random()*state.chores.length):null; changed=true; }
  if(state.challengeDate!==t){
    state.challengeDate=t;
    const pool=[
      {txt:"Mach heute 3 verschiedene Aufgaben", bonus:20, type:"variety", goal:3},
      {txt:"Sammle heute 40 Punkte", bonus:15, type:"points", goal:40},
      {txt:"Erledige die Goldene Aufgabe", bonus:25, type:"golden", goal:1},
      {txt:"Mach 2 Aufgaben hintereinander", bonus:15, type:"streak", goal:2},
    ];
    state.challenge=pool[Math.floor(Math.random()*pool.length)];
    state.challenge.doneBy=null;
    state.challenge.todayCounts={};
    changed=true;
  }
  if(changed) save();
}

/* ---------- Helpers ---------- */
function rankIndex(pts){ let i=0; for(let k=0;k<RANKS.length;k++) if((pts||0)>=RANKS[k].min) i=k; return i; }
function rankOf(pts){ return RANKS[rankIndex(pts)]; }
function nextRank(pts){ const i=rankIndex(pts); return i<RANKS.length-1? RANKS[i+1] : null; }
function winsOf(p){ return state.history.filter(h=>h.winner===p).length; }
function histScore(h,p){ return h.scores ? (h.scores[p]||0) : (h[p]||0); }
function currentScores(){ const m={}; PLAYER_IDS.forEach(p=>m[p]=state.data[p].score); return m; }
function weekWinner(scoreMap){ let mx=-1, w=[]; PLAYER_IDS.forEach(p=>{ const v=scoreMap[p]||0; if(v>mx){mx=v;w=[p];} else if(v===mx) w.push(p); }); return (mx<=0||w.length>1)?"tie":w[0]; }

function checkAchievements(p){
  const w=state.data[p], s=state.stats[p], wins=winsOf(p);
  s.achieved=s.achieved||[];
  const newly=[];
  for(const a of ACHIEVEMENTS){
    if(s.achieved.includes(a.id)) continue;
    let ok=false; try{ ok=a.test(w,s,state.history,wins);}catch(e){}
    if(ok){ s.achieved.push(a.id); newly.push(a); }
  }
  return newly;
}

/* ---------- Scoring ---------- */
function doChore(idx, ev, btn){
  const c=state.chores[idx]; if(!c) return;
  const p=active, d=state.data[p], s=state.stats[p];
  const isGolden = idx===state.golden;
  const pts = c.p*(isGolden?2:1);
  const prevRank = rankIndex(s.allTimePoints);

  d.score+=pts; d.total+=1;
  d.choreCounts[c.n]=(d.choreCounts[c.n]||0)+1;
  d.streak=(state.data.lastBy===p)? d.streak+1 : 1;
  d.bestStreak=Math.max(d.bestStreak||0, d.streak);
  if(isGolden) d.goldenDone=(d.goldenDone||0)+1;
  state.data.lastBy=p;

  s.allTimeTotal++; s.allTimePoints+=pts;
  const hr=new Date().getHours();
  if(hr<8) s.earlyBird=true; if(hr>=22) s.nightOwl=true;
  const t=todayStr();
  if(s.lastDay!==t){ s.dayStreak=(s.lastDay===yesterdayStr())? s.dayStreak+1 : 1; s.lastDay=t; s.bestDayStreak=Math.max(s.bestDayStreak||0,s.dayStreak); }

  const ch=state.challenge;
  if(ch && !ch.doneBy){
    const tc=ch.todayCounts||(ch.todayCounts={});
    tc[p]=(tc[p]||0)+1; const vk=p+"Var"; tc[vk]=tc[vk]||[]; if(!tc[vk].includes(c.n)) tc[vk].push(c.n);
    let done=false;
    if(ch.type==="variety") done=tc[vk].length>=ch.goal;
    else if(ch.type==="points") done=d.score>=ch.goal;
    else if(ch.type==="golden") done=isGolden;
    else if(ch.type==="streak") done=d.streak>=ch.goal;
    if(done){ ch.doneBy=p; d.score+=ch.bonus; s.allTimePoints+=ch.bonus; s.challengesDone++;
      flash(ev,"+"+ch.bonus+" 🎯", colorOf(p));
      celebrate("🎯","Challenge geschafft!", ch.txt+" · +"+ch.bonus+" Bonus", true); }
  }

  const entry={p, n:c.n, e:c.e, pts, t:Date.now(), golden:isGolden};
  state.data.log.unshift(entry); state.data.log=state.data.log.slice(0,60);

  const newRank=rankIndex(s.allTimePoints);
  const newly=checkAchievements(p);

  save();

  if(btn){ ripple(btn,ev); btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
  flash(ev, "+"+pts+(isGolden?" ✨":""), colorOf(p));
  if(isGolden) confettiBurst(ev?ev.clientX:innerWidth/2, ev?ev.clientY:innerHeight/2, 26);
  if(navigator.vibrate) navigator.vibrate(isGolden?[20,40,20]:15);
  render(); bumpScore(p);
  showUndo(entry);

  if(newRank>prevRank){ const rk=RANKS[newRank];
    celebrate(rk.e+"⬆️", "Neuer Rang!", PLAYERS[p].name+" ist jetzt „"+rk.name+"“", true); }
  newly.forEach(a=>celebrate(a.e, "Abzeichen freigeschaltet!", PLAYERS[p].name+": "+a.n+" – "+a.d, true));
}

function undo(ts){
  const i=state.data.log.findIndex(x=>x.t===ts); if(i<0) return false;
  const e=state.data.log[i], d=state.data[e.p], s=state.stats[e.p];
  d.score=Math.max(0,d.score-e.pts); d.total=Math.max(0,d.total-1);
  if(d.choreCounts[e.n]) d.choreCounts[e.n]--;
  if(e.golden) d.goldenDone=Math.max(0,(d.goldenDone||0)-1);
  if(s){ s.allTimeTotal=Math.max(0,s.allTimeTotal-1); s.allTimePoints=Math.max(0,s.allTimePoints-e.pts); }
  state.data.log.splice(i,1);
  save(); render();
  return true;
}

/* ---------- FX ---------- */
function flash(ev, txt, color){
  const x=ev?ev.clientX:innerWidth/2, y=ev?ev.clientY:innerHeight/2;
  const el=document.createElement("div"); el.className="float"; el.textContent=txt; el.style.color=color;
  el.style.left=(x-20)+"px"; el.style.top=(y-20)+"px"; document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function ripple(btn, ev){
  const r=btn.getBoundingClientRect();
  const sp=document.createElement("span"); sp.className="ripple";
  sp.style.left=((ev?ev.clientX:r.left+r.width/2)-r.left)+"px";
  sp.style.top=((ev?ev.clientY:r.top+r.height/2)-r.top)+"px";
  btn.appendChild(sp); sp.style.animation="rippleAnim .5s ease-out"; setTimeout(()=>sp.remove(),520);
}
function confettiBurst(x,y,n){
  const cols=["#fbbf24","#34d399","#38bdf8","#f472b6","#a78bfa","#fb7185","#fb923c"];
  for(let i=0;i<n;i++){
    const el=document.createElement("div"); el.className="confetti";
    const sz=6+Math.random()*8; el.style.width=sz+"px"; el.style.height=(sz*1.4)+"px";
    el.style.left=x+"px"; el.style.top=y+"px"; el.style.background=cols[i%cols.length];
    document.body.appendChild(el);
    const ang=Math.random()*Math.PI*2, dist=60+Math.random()*120;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist - 60;
    el.animate([
      {transform:`translate(0,0) rotate(0deg)`, opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720-360}deg)`, opacity:1, offset:.5},
      {transform:`translate(${dx*1.2}px,${dy+260}px) rotate(${Math.random()*720}deg)`, opacity:0}
    ],{duration:1100+Math.random()*500, easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish=()=>el.remove();
  }
}
function bumpScore(p){
  const el=document.querySelector(".player."+p+" .pscore"); if(!el) return;
  el.classList.add("bump"); setTimeout(()=>el.classList.remove("bump"),160);
}

let celebQ=[], celebBusy=false;
function celebrate(emoji,title,sub,burst){ celebQ.push({emoji,title,sub,burst}); if(!celebBusy) nextCeleb(); }
function nextCeleb(){
  if(!celebQ.length){ celebBusy=false; return; }
  celebBusy=true; const c=celebQ.shift();
  const wrap=document.createElement("div"); wrap.className="celebrate";
  wrap.innerHTML=`<div class="card"><div class="ce">${c.emoji}</div><div class="ct">${c.title}</div><div class="cs">${c.sub||""}</div></div>`;
  const card=wrap.querySelector(".card"); card.style.animation="celebIn .4s ease both";
  document.body.appendChild(wrap);
  if(c.burst) confettiBurst(innerWidth/2, innerHeight*0.4, 40);
  if(navigator.vibrate) navigator.vibrate([20,30,20,30,40]);
  setTimeout(()=>{ card.style.animation="celebOut .35s ease forwards"; setTimeout(()=>{ wrap.remove(); nextCeleb(); },340); }, 1500);
}

let snackTimer=null;
function showUndo(entry){
  const sb=document.getElementById("snackbar");
  sb.innerHTML=`<span>${entry.e} <b>${entry.n}</b> · ${PLAYERS[entry.p].name} +${entry.pts}</span><button>↺ Rückgängig</button>`;
  sb.querySelector("button").onclick=()=>{ if(undo(entry.t)){ if(navigator.vibrate)navigator.vibrate(10); } hideSnack(); };
  sb.classList.add("show");
  clearTimeout(snackTimer); snackTimer=setTimeout(hideSnack,5000);
}
function hideSnack(){ document.getElementById("snackbar").classList.remove("show"); }

/* ---------- Render ---------- */
function medalsFor(p){ return state.stats[p].achieved.map(id=>{ const a=ACHIEVEMENTS.find(x=>x.id===id); return a?a.e:""; }).filter(Boolean); }
function renderBoard(){
  const board=document.getElementById("board");
  const scores=currentScores();
  const max=Math.max(...PLAYER_IDS.map(p=>scores[p]),1);
  const topWinner=weekWinner(scores);
  board.innerHTML="";
  for(const key of PLAYER_IDS){
    const P=PLAYERS[key], d=state.data[key], s=state.stats[key];
    const lp=s.allTimePoints||0, rk=rankOf(lp), nr=nextRank(lp);
    const rankPct = nr? Math.min(100, Math.max(0,((lp-rk.min)/(nr.min-rk.min))*100)) : 100;
    const pct=Math.min(100,(d.score/max)*100), leading=(key===topWinner)&&d.score>0;
    const meds=medalsFor(key); const shown=meds.slice(0,7).join(" "); const extra=meds.length>7?` <span class="more">+${meds.length-7}</span>`:"";
    const div=document.createElement("div"); div.className="player "+P.cls+(active===key?" active":"");
    div.innerHTML=`
      <div class="glow"></div>
      ${leading?'<div class="crown">👑</div>':''}
      <div class="top">
        ${avatarHTML(key, rankIndex(lp), 54)}
        <div><div class="pname">${P.name}</div>
          <div class="plevel">${rk.e} ${rk.name}</div></div>
      </div>
      <div class="pscore">${d.score}<small> Pkt/Woche</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="streak">🔥 Serie: ${state.data.lastBy===key?d.streak:0}</div>
      <div class="rankrow">⭐ ${lp} Pkt gesamt · ${nr? `bis ${nr.e} ${nr.name}: ${nr.min-lp}` : "Höchster Rang! 🏆"}</div>
      <div class="bar mini"><i style="width:${rankPct}%"></i></div>
      <div class="medals">${shown||'<span class="more">noch keine Abzeichen</span>'}${extra}</div>`;
    div.onclick=()=>{ setActive(key); render(); };
    board.appendChild(div);
  }
}
function renderToggle(){
  const t=document.getElementById("toggle"); t.innerHTML="";
  PLAYER_IDS.forEach(p=>{
    const b=document.createElement("button");
    b.className=PLAYERS[p].cls+(active===p?" on":"");
    b.textContent=PLAYERS[p].emoji+" "+PLAYERS[p].name;
    b.onclick=()=>{ setActive(p); render(); };
    t.appendChild(b);
  });
}
function renderChallenge(){
  const w=document.getElementById("challengeWrap"), ch=state.challenge; if(!ch){w.innerHTML="";return;}
  w.innerHTML=`<div class="section-title">Tages-Challenge</div>
    <div class="chip" style="font-size:15px; padding:12px 14px; display:flex; width:100%;">
      🎯 ${ch.txt} <b style="color:var(--gold); margin-left:auto;">+${ch.bonus}</b>
      ${ch.doneBy?`<span style="color:var(--green); margin-left:8px;">✓ ${PLAYERS[ch.doneBy].name}</span>`:""}
    </div>`;
}
function renderGrid(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  state.chores.forEach((c,i)=>{
    const golden=i===state.golden;
    const b=document.createElement("button"); b.className="chore"+(golden?" golden":"");
    b.innerHTML=`${golden?'<span class="badge">2× ✨</span>':''}
      <span class="emoji">${c.e}</span><span class="cname">${c.n}</span>
      <span class="pts">+${golden?c.p*2:c.p} Pkt</span>`;
    b.onclick=(ev)=>doChore(i,ev,b);
    grid.appendChild(b);
  });
}
function fmtTime(t){
  const d=new Date(t), now=new Date(), same=d.toDateString()===now.toDateString();
  return same? d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
             : d.toLocaleDateString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"});
}
function renderLog(){
  const log=document.getElementById("log");
  if(!state.data.log.length){ log.innerHTML='<div class="empty">Noch keine Aufgaben erledigt. Leg los! 💪</div>'; return; }
  log.innerHTML="";
  state.data.log.forEach(e=>{
    const color=colorOf(e.p);
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`<span class="who" style="background:${color}"></span>
      <span>${e.e} ${e.n} ${e.golden?"✨":""}</span>
      <span style="color:var(--gold); font-weight:700;">+${e.pts}</span>
      <span class="t">${fmtTime(e.t)}</span><button class="undo" title="Rückgängig">↺</button>`;
    row.querySelector(".undo").onclick=()=>undo(e.t);
    log.appendChild(row);
  });
}
function render(){
  document.getElementById("weekLabel").textContent="Aktuelle Woche · "+state.week.replace("-W"," KW ")+" · Reset Mo 00:00";
  renderBoard(); renderToggle(); renderChallenge(); renderGrid(); renderLog();
}

/* ---------- Edit ---------- */
function renderEdit(){
  const list=document.getElementById("editList"); list.innerHTML="";
  state.chores.forEach((c,i)=>{
    const r=document.createElement("div"); r.className="editrow";
    r.innerHTML=`<input class="em" value="${c.e}" maxlength="2">
      <input class="nm" value="${c.n.replace(/"/g,'&quot;')}">
      <input class="pt" type="number" value="${c.p}" min="1"><button class="del">🗑️</button>`;
    const [em,nm,pt]=r.querySelectorAll("input");
    em.oninput=()=>{c.e=em.value||"✅"; save(); renderGrid();};
    nm.oninput=()=>{ c.n=nm.value||"Aufgabe"; if(c.e==="✅"){ const g=guessIcon(c.n); if(g){ c.e=g; em.value=g; } } save(); renderGrid(); };
    pt.oninput=()=>{c.p=Math.max(1,parseInt(pt.value)||1); save(); renderGrid();};
    r.querySelector(".del").onclick=()=>{ state.chores.splice(i,1); save(); renderEdit(); render(); };
    list.appendChild(r);
  });
}
document.getElementById("addChore").onclick=()=>{ state.chores.push({e:"✅",n:"Neue Aufgabe",p:10}); save(); renderEdit(); render(); };
document.getElementById("editBtn").onclick=()=>{ renderEdit(); document.getElementById("editOverlay").classList.add("show"); };
document.getElementById("editDone").onclick=()=>{ document.getElementById("editOverlay").classList.remove("show"); ensureDaily(); render(); };

/* ---------- Trophy room ---------- */
let trophyTab="koni";
function renderTrophy(){
  const m=document.getElementById("trophyModal"), p=trophyTab, s=state.stats[p];
  const unlocked=s.achieved.length, totalA=ACHIEVEMENTS.length;
  const lp=s.allTimePoints||0, rk=rankOf(lp), nr=nextRank(lp);
  const rankPct = nr? Math.min(100, Math.max(0,((lp-rk.min)/(nr.min-rk.min))*100)) : 100;
  const grid=ACHIEVEMENTS.map(a=>{
    const got=s.achieved.includes(a.id);
    return `<div class="trophy ${got?"":"locked"}"><div class="te">${a.e}</div><div class="tn">${a.n}</div><div class="td">${a.d}</div></div>`;
  }).join("");
  const ranklist=RANKS.map((r,i)=>{
    const cur=i===rankIndex(lp), got=lp>=r.min;
    return `<div class="trophy ${got?"":"locked"}" style="${cur?'box-shadow:inset 0 0 0 2px var(--gold);':''}">
      <div class="te">${r.e}</div><div class="tn">${r.name}</div><div class="td">${r.min} Pkt</div></div>`;
  }).join("");
  m.innerHTML=`<h2>🏅 Trophäen &amp; Ränge</h2>
    <div class="tabs">
      ${PLAYER_IDS.map(id=>`<button class="${PLAYERS[id].cls} ${p===id?"sel":""}" data-t="${id}">${PLAYERS[id].emoji} ${PLAYERS[id].name}</button>`).join("")}
    </div>
    <div style="display:flex;justify-content:center;margin:6px 0 12px;">${avatarHTML(p, rankIndex(lp), 84)}</div>
    <div style="text-align:center;font-size:19px;font-weight:800;margin-bottom:6px;">${rk.e} ${rk.name}</div>
    <div style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px;">
      ${lp} Punkte gesamt${nr?` · noch ${nr.min-lp} bis ${nr.e} ${nr.name}`:` · höchster Rang erreicht! 🏆`}</div>
    <div class="bar" style="margin-bottom:16px;"><i style="width:${rankPct}%;background:var(--gold);"></i></div>
    <div class="tstat">
      <div class="box"><b>${unlocked}/${totalA}</b><span>Abzeichen</span></div>
      <div class="box"><b>${s.allTimeTotal}</b><span>Aufgaben gesamt</span></div>
      <div class="box"><b>${winsOf(p)}</b><span>Wochensiege</span></div>
      <div class="box"><b>${s.bestDayStreak}🔥</b><span>Beste Tagesserie</span></div>
    </div>
    <div class="section-title" style="margin:4px;">Abzeichen</div>
    <div class="trophy-grid">${grid}</div>
    <div class="section-title" style="margin:14px 4px 8px;">Rang-Leiter (immer schwerer)</div>
    <div class="trophy-grid">${ranklist}</div>
    <div class="btnrow"><button class="btn" id="trClose">Schließen</button></div>
    <button class="btn danger" id="trReset" style="width:100%;margin-top:10px;">🗑️ Punkte &amp; Abzeichen löschen</button>
    <p style="text-align:center;margin:8px 0 0;font-size:12px;">Setzt für ALLE Spieler alles auf Null (Punkte, Ränge, Abzeichen, Wochen-Historie). Aufgabenliste bleibt.</p>`;
  m.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ trophyTab=b.dataset.t; renderTrophy(); });
  m.querySelector("#trClose").onclick=()=>document.getElementById("trophyOverlay").classList.remove("show");
  m.querySelector("#trReset").onclick=()=>{ if(resetAll()) renderTrophy(); };
}
function resetAll(){
  if(!confirm("Wirklich ALLES löschen?\n\nPunkte, Ränge, Abzeichen und die komplette Wochen-Historie – für alle Spieler. Das kann nicht rückgängig gemacht werden.")) return false;
  if(!confirm("Ganz sicher? Letzte Warnung – alles wird auf Null gesetzt.")) return false;
  state.data=freshWeek();
  state.stats={}; PLAYER_IDS.forEach(p=>state.stats[p]=freshStats());
  state.history=[];
  save(); render();
  celebrate("🧼","Zurückgesetzt","Punkte & Abzeichen stehen wieder bei Null!", false);
  return true;
}
function resetEverything(){
  if(!confirm("ALLES komplett zurücksetzen?\n\nPunkte, Ränge, Abzeichen, Wochen-Historie UND die Aufgabenliste werden auf den Auslieferungszustand gesetzt. Das kann nicht rückgängig gemacht werden.")) return;
  if(!confirm("Ganz sicher? Wirklich alles auf Werkseinstellung?")) return;
  state.data=freshWeek();
  state.stats={}; PLAYER_IDS.forEach(p=>state.stats[p]=freshStats());
  state.history=[];
  state.chores=DEFAULT_CHORES.slice();
  state.golden=null; state.goldenDay=null; state.challenge=null; state.challengeDate=null;
  state.migrations={kidChores:true};
  save(); ensureDaily();
  document.getElementById("syncOverlay").classList.remove("show");
  render();
  celebrate("🧼","Komplett zurückgesetzt","Alles auf Anfang – viel Spaß!", false);
}
document.getElementById("trophyBtn").onclick=()=>{ trophyTab=active; renderTrophy(); document.getElementById("trophyOverlay").classList.add("show"); };

/* ---------- Week modal ---------- */
function showWeekResult(h, auto){
  const m=document.getElementById("weekModal");
  let winHtml; if(h.winner==="tie") winHtml=`<div class="winner">🤝 Unentschieden!</div>`;
  else{ const P=PLAYERS[h.winner]; winHtml=`<div class="big">${P.emoji}🏆</div><div class="winner">${P.name} gewinnt!</div>`; }
  const rw=h.reward||pickReward();
  const forWho = h.winner==="tie" ? "für alle 💕" : "für "+PLAYERS[h.winner].name;
  const scoreLine = PLAYER_IDS.map(p=>PLAYERS[p].name+" "+histScore(h,p)).join(" · ");
  m.innerHTML=`${auto?'<p style="text-align:center">Neue Woche gestartet 🎉</p>':''}${winHtml}
    <div class="sub">${h.week.replace("-W"," KW ")}<br>${scoreLine}</div>
    <div style="background:var(--panel2);border:2px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:16px;text-align:center;">
      <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px;">🎁 Zufälliger Wochenpreis ${forWho}</div>
      <div style="font-size:40px;line-height:1;margin:4px 0;">${rw.e}</div>
      <div style="font-size:17px;font-weight:700;">${rw.t}</div>
    </div>
    <div class="btnrow"><button class="btn" id="wReroll">🎲 Neu würfeln</button><button class="btn primary" id="wOk">Einlösen 🎉</button></div>`;
  document.getElementById("weekOverlay").classList.add("show");
  document.getElementById("wOk").onclick=()=>document.getElementById("weekOverlay").classList.remove("show");
  const rr=document.getElementById("wReroll");
  if(rr) rr.onclick=()=>{ h.reward=pickReward(); save(); showWeekResult(h, auto); };
  if(h.winner!=="tie") confettiBurst(innerWidth/2, innerHeight*0.35, 60);
}
document.getElementById("weekBtn").onclick=()=>{
  const m=document.getElementById("weekModal");
  const wn=weekWinner(currentScores());
  const lead = wn==="tie" ? "Gleichstand" : PLAYERS[wn].name+" führt";
  const hist=state.history.map(h=>{ const w=h.winner==="tie"?"🤝":PLAYERS[h.winner].emoji;
    const sc=PLAYER_IDS.map(p=>PLAYERS[p].name[0]+" "+histScore(h,p)).join(" · ");
    return `<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;">
      <span>${h.week.replace("-W"," KW ")} ${h.reward?h.reward.e:""}</span><span>${sc} ${w}</span></div>`;
  }).join("")||'<div class="empty">Noch keine abgeschlossenen Wochen.</div>';
  const chips=PLAYER_IDS.map(p=>`<div class="chip" style="flex:1;justify-content:center;color:var(--${p});font-size:17px;">${PLAYERS[p].emoji} ${state.data[p].score}</div>`).join("");
  m.innerHTML=`<h2>🎁 Wochenstand</h2><p>${lead} · Wochensieger bekommt einen zufälligen Preis!</p>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">${chips}</div>
    <div class="section-title" style="margin:4px;">Vergangene Wochen</div>${hist}
    <div class="btnrow"><button class="btn" id="wClose">Schließen</button><button class="btn danger" id="wReset">Woche jetzt beenden</button></div>`;
  document.getElementById("weekOverlay").classList.add("show");
  document.getElementById("wClose").onclick=()=>document.getElementById("weekOverlay").classList.remove("show");
  document.getElementById("wReset").onclick=()=>{
    if(!confirm("Aktuelle Woche beenden und Sieger küren? Punkte werden zurückgesetzt.")) return;
    const scores=currentScores();
    state.history.unshift({week:state.week, scores, winner:weekWinner(scores), reward:pickReward()});
    state.history=state.history.slice(0,30);
    state.data=freshWeek(); PLAYER_IDS.forEach(p=>checkAchievements(p)); save();
    showWeekResult(state.history[0], false);
  };
};

/* ---------- Sync modal ---------- */
function openSync(){
  const m=document.getElementById("syncModal"), configured=!!FIREBASE_CONFIG.apiKey, code=getFamilyCode();
  let status=!configured?'⚪ Lokal (keine Firebase-Zugangsdaten)':(docRef?'🟢 Verbunden':(code?'🟠 Verbinde…':'⚪ Noch kein Familien-Code'));
  m.innerHTML=`<h2>☁️ Synchronisation</h2><p>${status}</p>
    ${configured?`<label style="font-size:13px;color:var(--muted);">Familien-Code (auf allen Geräten gleich):</label>
      <input class="field" id="famInput" placeholder="z.B. whittaker" value="${code.replace(/"/g,'')}">
      <div class="btnrow"><button class="btn primary" id="famSave">Speichern &amp; verbinden</button></div>`
    :`<p>Trag oben im Code (FIREBASE_CONFIG) deine Firebase-Daten ein.</p>`}
    <div class="section-title" style="margin:18px 4px 8px;">Zurücksetzen</div>
    <button class="btn danger" id="resetScores" style="width:100%;margin-bottom:8px;">🧹 Punkte &amp; Abzeichen zurücksetzen</button>
    <button class="btn danger" id="resetAllBtn" style="width:100%;">🗑️ Komplett zurücksetzen (inkl. Aufgabenliste)</button>
    <p style="font-size:12px;margin:8px 0 0;">Gilt für alle Spieler &amp; alle Geräte (wird synchronisiert). Kann nicht rückgängig gemacht werden.</p>
    <div class="btnrow"><button class="btn" id="syncClose">Schließen</button></div>`;
  document.getElementById("syncOverlay").classList.add("show");
  document.getElementById("syncClose").onclick=()=>document.getElementById("syncOverlay").classList.remove("show");
  document.getElementById("resetScores").onclick=()=>{ if(resetAll()) document.getElementById("syncOverlay").classList.remove("show"); };
  document.getElementById("resetAllBtn").onclick=resetEverything;
  const fs=document.getElementById("famSave");
  if(fs) fs.onclick=()=>{ const v=document.getElementById("famInput").value.trim(); if(!v){alert("Bitte Code eingeben.");return;}
    setFamilyCode(v); location.reload(); };
}
document.getElementById("syncBtn").onclick=()=>openSync();

document.querySelectorAll(".overlay").forEach(o=>o.onclick=(e)=>{ if(e.target===o) o.classList.remove("show"); });

/* ---------- Boot ---------- */
checkWeek(); ensureDaily(); runMigrations(); render(); initSync();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ checkWeek(); ensureDaily(); render(); }});
</script>
</body>
</html>
